# Administrace webu (Decap CMS). Adresa: https://VAS-WEB/admin
backend:
  name: github
  repo: pavelkochcz/pavel-koch-web
  branch: main
  commit_messages:
    update: "Úprava: {{slug}}"

locale: cs
site_url: /
display_url: /
media_folder: images/dila
public_folder: /images/dila

collections:
  - name: dila
    label: Díla
    editor: { preview: false }
    files:
      - name: seznam
        label: Všechna díla (pořadí = pořadí na webu)
        file: content/works.json
        fields:
          - name: works
            label: Díla
            label_singular: dílo
            widget: list
            add_to_top: true
            collapsed: true
            summary: "{{fields.title}} · {{fields.year}} · {{fields.status}}"
            fields:
              - { name: title, label: Název díla, widget: string }
              - name: images
                label: Fotografie (první je hlavní, u soch klidně víc pohledů)
                widget: list
                field: { name: image, label: Fotka, widget: image, choose_url: false }
              - { name: year, label: Rok, widget: string, required: false }
              - name: category
                label: Druh
                widget: select
                options: [Malba, Kresba, Socha, Objekt, Keramika, Projekt]
                default: Malba
              - name: theme
                label: Téma (podle něj se filtrují díla)
                widget: select
                options: [Město, Krajina, Figura, Zátiší, Barevné plochy, Socha, Kresba]
                required: false
              - { name: frame, label: Doplnit dřevěný rámeček (fotka je bez rámu), widget: boolean, required: false, default: false }
              - { name: tilt, label: Náklon na zdi (stupně), widget: number, value_type: float, required: false, default: 0, hint: "Jak je obraz úmyslně nakloněný při zavěšení. Kladné číslo = pravý okraj níž, záporné = výš. 0 = rovně." }
              - { name: hidden, label: Skrýt na webu, widget: boolean, required: false, default: false, hint: "Dílo zůstane v administraci, ale na webu se nezobrazí." }
              - { name: project, label: Patří do Další tvorby (obálky, návrhy, PF…), widget: boolean, required: false, default: false }
              - { name: series, label: Cyklus (např. Malé obrazy, Barevné plochy), widget: string, required: false, hint: "Podle cyklu se na webu dělí filtr děl." }
              - { name: technique, label: Technika, widget: string, required: false, hint: "např. olej na desce" }
              - { name: width, label: Šířka (cm), widget: number, value_type: float, required: false, default: 0 }
              - { name: height, label: Výška (cm), widget: number, value_type: float, required: false, default: 0 }
              - { name: depth, label: Hloubka (cm, jen u soch), widget: number, value_type: float, required: false, default: 0 }
              - name: status
                label: Stav (nepovinné)
                widget: select
                required: false
                options: [Dostupné, Rezervováno, Prodáno, Soukromá sbírka]
              - { name: price, label: Cena (nechte prázdné = „na dotaz“), widget: string, required: false, hint: "např. 18 000 Kč" }
              - { name: featured, label: Hlavní dílo, widget: boolean, required: false, default: false }
              - { name: place, label: Místo (nepovinné, např. Praha – Karlín), widget: string, required: false }
              - { name: description, label: Popis (nepovinné), widget: text, required: false }
              - name: process
                label: Jak vznikalo – skici a fáze (nepovinné)
                label_singular: fáze
                widget: list
                required: false
                fields:
                  - { name: image, label: Fotka skici / fáze, widget: image, choose_url: false }
                  - { name: label, label: Popisek (např. Skica, Model 1:10), widget: string }

  - name: nastaveni
    label: O autorovi a kontakt
    editor: { preview: false }
    files:
      - name: web
        label: Texty a kontakt
        file: content/site.json
        fields:
          - { name: name, label: Jméno, widget: string }
          - { name: titles, label: Tituly, widget: string, required: false }
          - { name: disciplines, label: Podtitul pod jménem, widget: string, required: false }
          - { name: statement, label: Velká věta na úvodu (nepovinné), widget: text, required: false }
          - { name: portrait, label: Portrét, widget: image, required: false, choose_url: false }
          - { name: bio, label: O autorovi (odstavce oddělte prázdným řádkem), widget: text }
          - { name: quote, label: Citát (nepovinné), widget: string, required: false }
          - name: cv
            label: Vybrané realizace a výstavy
            label_singular: položka
            widget: list
            fields:
              - { name: year, label: Rok (nepovinné), widget: string, required: false }
              - { name: text, label: Text (role oddělte pomlčkou „ – “), widget: string }
          - { name: film, label: Film, widget: string, required: false }
          - { name: education, label: Vzdělání, widget: string, required: false }
          - name: walk
            label: Noční procházka (vodorovná sekce)
            widget: object
            fields:
              - { name: title, label: Nadpis, widget: string }
              - { name: text, label: Text, widget: text, required: false }
              - { name: series, label: Které cykly ukázat, widget: list, field: { name: s, label: Cyklus, widget: string } }
          - { name: email, label: E-mail, widget: string }
          - { name: phone, label: Telefon, widget: string, required: false }
          - { name: instagram, label: Instagram (jen jméno účtu), widget: string, required: false }
          - { name: location, label: Ateliér / místo, widget: string, required: false }
